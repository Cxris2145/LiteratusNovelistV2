<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Literatus Novelist — Lee. Escucha. Vívelo.</title>
  <meta name="description" content="Explora clásicos inmortales y conversa con sus personajes mediante IA en tiempo real. La biblioteca literaria del futuro.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- ── Google Fonts: Preconnect para carga ultra-rápida ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!--
    SISTEMA TIPOGRÁFICO DE LITERATUS NOVELIST
    ─────────────────────────────────────────
    Cormorant Garamond  → Headlines épicos / Hero titles (display serif con alma literaria)
    Plus Jakarta Sans   → UI / Body / Nav (moderna, premium, excelente legibilidad)
    Cinzel              → Logo de marca (romana clásica, autoridad literaria)
    EB Garamond         → Citas y textos literarios (se mantiene para blockquotes)
  -->

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&amp;family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&amp;family=Cinzel:wght@400;600;700;900&amp;family=EB+Garamond:ital,wght@0,400;1,400;1,500&amp;display=swap" rel="stylesheet">

  <!-- Material Symbols Rounded — Iconos nítidos para el dropdown del menú -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1976d2">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('literatus-theme');
        if (theme && theme !== 'default') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
