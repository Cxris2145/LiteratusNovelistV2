  <!-- ── Conexiones adelantadas ──
    API (Azure): la primera llamada salía recién cuando Angular terminaba de arrancar y pagaba ahí
    la conexión nueva (DNS + TCP + TLS: 1-2 s en un celular con 4G lenta). Las llamadas van por
    fetch/XHR sin credenciales, por eso `crossorigin`.
    Portadas y retratos (Supabase Storage): se piden con <img> normales, que usan conexiones *sin*
    `crossorigin`; con ese atributo el navegador abría una conexión que las imágenes no reutilizaban.
    El otro proyecto de Supabase solo lo usa el cliente supabase-js en algunas pantallas: basta el DNS. -->
  <link rel="preconnect" href="https://literatus-novelist.westus.cloudapp.azure.com" crossorigin>
  <link rel="preconnect" href="https://tknsbrxgkreikcbowvla.supabase.co">
  <link rel="dns-prefetch" href="https://srbmswjsbkpftjabcurg.supabase.co">

  <!--
    Iconos Material Symbols servidos desde el sitio, con solo los iconos que usa el código
    (174 KB y 135 KB en vez de 5,4 MB y 4 MB; el tamaño óptico va fijo en 24). Se generan con scripts/icon-fonts/subset_icons.py;
    `npm start` y `npm run build` avisan si el código usa un icono que no está.
    Sin <link rel="preload">: en 4G lenta competía con el JS y atrasaba la primera pintura.
  -->
  <style>
    @font-face { font-family: 'Material Symbols Outlined'; font-style: normal; font-weight: 100 700; font-display: block; src: url(/assets/fonts/material-symbols-outlined.woff2) format('woff2'); }

    .material-symbols-outlined, .material-symbols-rounded { font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
    .material-symbols-outlined { font-family: 'Material Symbols Outlined'; }
    .material-symbols-rounded { font-family: 'Material Symbols Rounded'; }
  </style>

  <!--
    SISTEMA TIPOGRÁFICO DE LITERATUS NOVELIST
    ─────────────────────────────────────────
    Cormorant Garamond  → Headlines épicos / Hero titles (display serif con alma literaria)
    Plus Jakarta Sans   → UI / Body / Nav (moderna, premium, excelente legibilidad)
    Cinzel              → Logo de marca (romana clásica, autoridad literaria)
    EB Garamond         → Citas y textos literarios (se mantiene para blockquotes)

    Se sirven desde el propio sitio (woff2 variables de Google Fonts, licencia OFL). Antes eran tres
    hojas de fonts.googleapis.com que bloqueaban la primera pintura: en un celular con 4G lenta eso
    sumaba dos conexiones nuevas (googleapis + gstatic) antes de ver nada. Solo se descarga el
    subconjunto que la página usa (latin; latin-ext si aparece un carácter de ese rango).
    Las letras del lector y del cuaderno (Literata, Merriweather, Space Grotesk…) se piden al abrir
