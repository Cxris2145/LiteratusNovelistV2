<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Literatus Novelist — Lee. Escucha. Vívelo.</title>
  <meta name="description" content="Explora clásicos inmortales y conversa con sus personajes mediante IA en tiempo real. La biblioteca literaria del futuro.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- ── Google Fonts: Preconnect para carga ultra-rápida ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- ── Supabase Storage: Preconnect para adelantar DNS/TLS de las portadas ── -->
  <link rel="preconnect" href="https://tknsbrxgkreikcbowvla.supabase.co" crossorigin>
  <link rel="preconnect" href="https://srbmswjsbkpftjabcurg.supabase.co" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

  <!--
    Iconos Material Symbols servidos desde el sitio, con solo los iconos que usa el código
    (363 KB y 277 KB en vez de 5,4 MB y 4 MB). Se generan con scripts/icon-fonts/subset_icons.py;
    `npm start` y `npm run build` avisan si el código usa un icono que no está.
    Sin <link rel="preload">: en 4G lenta competía con el JS y atrasaba la primera pintura.
  -->
  <style>
    @font-face { font-family: 'Material Symbols Outlined'; font-style: normal; font-weight: 100 700; font-display: block; src: url(/assets/fonts/material-symbols-outlined.woff2) format('woff2'); }
    @font-face { font-family: 'Material Symbols Rounded'; font-style: normal; font-weight: 100 700; font-display: block; src: url(/assets/fonts/material-symbols-rounded.woff2) format('woff2'); }
    .material-symbols-outlined, .material-symbols-rounded { font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
    .material-symbols-outlined { font-family: 'Material Symbols Outlined'; }
    .material-symbols-rounded { font-family: 'Material Symbols Rounded'; }
  </style>

  <!--
    SISTEMA TIPOGRÁFICO DE LITERATUS NOVELIST
    ─────────────────────────────────────────
    Cormorant Garamond  → Headlines épicos / Hero titles (display serif con alma literaria)
    Plus Jakarta Sans   → UI / Body / Nav (moderna, premium, excelente legibilidad)
    Cinzel              → Logo de marca (romana clásica, autoridad literaria)
    EB Garamond         → Citas y textos literarios (se mantiene para blockquotes)
  -->

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&amp;family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&amp;family=Cinzel:wght@400;600;700;900&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&amp;display=swap" rel="stylesheet">

  <!--
    TIPOGRAFÍAS DEL LECTOR (opciones de "Aa" → Tipografía).
    Hoja de estilos normal (~2 KB): con display=swap NO bloquea el texto, y así
    la carga es fiable (el truco media="print"+onload puede no dispararse).
    Sólo los pesos que el lector usa (cuerpo 400, énfasis 500/600, negrita 700).
  -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,700;1,400&amp;family=Merriweather:wght@400;700&amp;family=Outfit:wght@400;500;600&amp;family=Open+Sans:wght@400;600&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;family=Lexend:wght@400;500&amp;display=swap">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Color de la barra del navegador/sistema; SettingsService lo actualiza al cambiar de tema. -->
  <meta name="theme-color" content="#15233B">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Literatus">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('literatus-theme');
        if (theme && theme !== 'default') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
