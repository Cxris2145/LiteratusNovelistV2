<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-label="Retrato no disponible">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11261d"/>
      <stop offset="100%" stop-color="#0A1914"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="600" fill="url(#bg)"/>
  <rect width="400" height="600" fill="url(#halo)"/>

  <!-- Silueta: cabeza y hombros -->
  <g fill="url(#gold)">
    <circle cx="200" cy="228" r="72"/>
    <path d="M200 318c-72 0-130 46-130 103v39h260v-39c0-57-58-103-130-103z"/>
  </g>

  <!-- Libro abierto bajo la silueta -->
  <g stroke="#D4AF37" stroke-opacity="0.42" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M118 500c26-12 52-12 78 0v58c-26-12-52-12-78 0z"/>
    <path d="M282 500c-26-12-52-12-78 0v58c26-12 52-12 78 0z"/>
    <path d="M200 500v58"/>
  </g>

  <!-- Marco sutil -->
  <rect x="12" y="12" width="376" height="576" rx="10" fill="none" stroke="#D4AF37" stroke-opacity="0.16" stroke-width="2"/>
</svg>
