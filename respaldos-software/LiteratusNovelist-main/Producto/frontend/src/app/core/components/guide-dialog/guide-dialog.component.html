<div class="guide-modal-container" [@.disabled]="prefersReducedMotion">
  <header class="guide-header">
    <div class="guide-header-copy">
      <span class="guide-label">Guía de Literatus</span>
      <span class="guide-step-counter" aria-live="polite" aria-atomic="true">
        {{ currentStep.tag }} · {{ currentStepIndex + 1 }} de {{ steps.length }}
      </span>
    </div>
    <button type="button" class="guide-close-btn" (click)="close()" aria-label="Cerrar guía">
      <span class="material-symbols-rounded" aria-hidden="true">close</span>
    </button>
    <div class="guide-progress" aria-hidden="true">
      <span [style.transform]="'scaleX(' + ((currentStepIndex + 1) / steps.length) + ')'"></span>
    </div>
  </header>

  <div class="guide-scroll" #scrollArea tabindex="0" role="region" aria-label="Contenido de la guía">
    <article class="guide-step-content"
             *ngFor="let step of [currentStep]; trackBy: trackStep"
             [@guideStep]="{ value: currentStepIndex, params: { enterX: animationDirection * 18 } }">
      <div class="guide-hero">
        <div class="guide-icon-wrap" aria-hidden="true">
          <span class="material-symbols-rounded guide-main-icon">{{ step.icon }}</span>
        </div>
        <div class="guide-hero-copy">
          <h2 class="guide-title" id="guide-title">{{ step.title }}</h2>
          <p class="guide-subtitle">{{ step.subtitle }}</p>
        </div>
      </div>
      <p class="guide-desc" id="guide-description">{{ step.description }}</p>
      <ul class="guide-points-list">
        <li class="guide-point-item" *ngFor="let point of step.points">
          <span class="point-icon-box material-symbols-rounded" aria-hidden="true">{{ point.icon }}</span>
          <span class="point-text">{{ point.text }}</span>
        </li>
      </ul>
      <button *ngIf="step.route" type="button" class="quick-nav-btn" (click)="navigateToSection(step.route)">
        <span>{{ step.actionText }}</span>
        <span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span>
      </button>
    </article>
  </div>

  <footer class="guide-footer">
    <nav class="guide-dots-indicator" aria-label="Pasos de la guía">
      <button type="button" *ngFor="let step of steps; let i = index" class="guide-dot"
              [class.active]="i === currentStepIndex" [class.passed]="i < currentStepIndex"
              [attr.aria-current]="i === currentStepIndex ? 'step' : null"
              [attr.aria-label]="'Paso ' + (i + 1) + ': ' + step.title" (click)="goToStep(i)">
        <span aria-hidden="true"></span>
      </button>
    </nav>
    <label class="guide-checkbox-label">
      <input type="checkbox" [(ngModel)]="dontShowAgain">
      <span>No mostrar al iniciar</span>
    </label>
    <div class="guide-nav-buttons">
      <button type="button" class="guide-btn guide-btn-prev" [disabled]="currentStepIndex === 0" (click)="prevStep()">
        <span class="material-symbols-rounded" aria-hidden="true">chevron_left</span>
        <span>Atrás</span>
      </button>
      <button type="button" class="guide-btn guide-btn-next" (click)="nextStep()">
        <span>{{ isLastStep ? 'Empezar' : 'Siguiente' }}</span>
        <span class="material-symbols-rounded" aria-hidden="true">{{ isLastStep ? 'check' : 'chevron_right' }}</span>
      </button>
    </div>
  </footer>
</div>
