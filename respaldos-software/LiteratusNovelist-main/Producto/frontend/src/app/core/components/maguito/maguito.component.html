<!-- Maguito en capas (SVG). Cada parte se anima por separado: ver maguito.component.css.
     Los id llevan un sufijo por instancia para que varios Maguitos convivan en la página. -->
<svg class="mg-svg" [attr.viewBox]="viewBox" focusable="false">
  <defs>
    <radialGradient [attr.id]="ids['body']" cx="0.34" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#86a3f7"/>
      <stop offset="0.3" stop-color="#5373e3"/>
      <stop offset="0.7" stop-color="#3452c6"/>
      <stop offset="1" stop-color="#1f3190"/>
    </radialGradient>
    <linearGradient [attr.id]="ids['body-shade']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1446" stop-opacity="0.55"/>
      <stop offset="0.16" stop-color="#0c1446" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#0c1446" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c1446" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['limb']" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5877e4"/>
      <stop offset="1" stop-color="#2c43b0"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['lid']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5ed4"/>
      <stop offset="1" stop-color="#5373e3"/>
    </linearGradient>
    <radialGradient [attr.id]="ids['hat']" cx="0.3" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#9d5fd8"/>
      <stop offset="0.45" stop-color="#6d2fad"/>
      <stop offset="1" stop-color="#3c1068"/>
    </radialGradient>
    <linearGradient [attr.id]="ids['brim']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b4bc9"/>
      <stop offset="0.55" stop-color="#63259c"/>
      <stop offset="1" stop-color="#441373"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['brim-under']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0c60"/>
      <stop offset="1" stop-color="#5b2090"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['band']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a2aa6"/>
      <stop offset="1" stop-color="#4c1880"/>
    </linearGradient>
    <!-- Los colores de la capa salen de variables: el Bazar vende capas de otros colores -->
    <linearGradient [attr.id]="ids['cape']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--mg-cape-a)"/>
      <stop offset="0.6" style="stop-color: var(--mg-cape-b)"/>
      <stop offset="1" style="stop-color: var(--mg-cape-c)"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['crown']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#f1c867"/>
      <stop offset="1" stop-color="#c8902a"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['tophat']" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3d5c"/>
      <stop offset="0.45" stop-color="#262940"/>
      <stop offset="1" stop-color="#15172a"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['beard']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e9edfa"/>
      <stop offset="1" stop-color="#a7b5d8"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['mustache']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#926247"/>
      <stop offset="0.5" stop-color="#573724"/>
      <stop offset="1" stop-color="#2c1c19"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['lens']" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5f1ff" stop-opacity="0.25"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#78b6db" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['metal']" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.35" stop-color="#d6a64f"/>
      <stop offset="0.6" stop-color="#fff0b8"/>
      <stop offset="1" stop-color="#986023"/>
    </linearGradient>
    <radialGradient [attr.id]="ids['velvet']" cx="0.3" cy="0.2" r="0.85">
      <stop offset="0" stop-color="#cf4d6a"/>
      <stop offset="0.5" stop-color="#962441"/>
      <stop offset="1" stop-color="#511629"/>
    </radialGradient>
    <linearGradient [attr.id]="ids['scarf']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#c0283a"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['witch-hat']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aa1936"/>
      <stop offset="0.6" stop-color="#721124"/>
      <stop offset="1" stop-color="#3d0712"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['witch-brim']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bd2344"/>
      <stop offset="1" stop-color="#540a1b"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['aviator-cap']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#734626"/>
      <stop offset="0.6" stop-color="#4d2c14"/>
      <stop offset="1" stop-color="#2a1608"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['goggle-glass']" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#90e0ef"/>
      <stop offset="0.6" stop-color="#0096c7"/>
      <stop offset="1" stop-color="#023e8a"/>
    </linearGradient>
    <radialGradient [attr.id]="ids['sclera']" cx="0.45" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f1f3fb"/>
      <stop offset="1" stop-color="#c9d0ea"/>
    </radialGradient>
    <radialGradient [attr.id]="ids['iris']" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#e5a864"/>
      <stop offset="0.45" stop-color="#b06a2d"/>
      <stop offset="0.85" stop-color="#6a3411"/>
      <stop offset="1" stop-color="#2f1506"/>
    </radialGradient>
    <linearGradient [attr.id]="ids['feather']" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f2a93a"/>
      <stop offset="0.5" stop-color="#ffd564"/>
      <stop offset="1" stop-color="#fff4c4"/>
    </linearGradient>
    <linearGradient [attr.id]="ids['nib']" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a1a"/>
      <stop offset="0.5" stop-color="#f3cd6b"/>
      <stop offset="1" stop-color="#9b6620"/>
    </linearGradient>
    <radialGradient [attr.id]="ids['glow']" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe48a" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffbf42" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffb938" stop-opacity="0"/>
    </radialGradient>
    <radialGradient [attr.id]="ids['aura']" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#f5b73b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f5b73b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient [attr.id]="ids['hat-glow']" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b56cff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#9b4dff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#9b4dff" stop-opacity="0"/>
    </radialGradient>
    <clipPath [attr.id]="ids['eye-l']"><circle cx="182" cy="215" r="26"/></clipPath>
    <clipPath [attr.id]="ids['eye-r']"><circle cx="252" cy="215" r="26"/></clipPath>
    <path [attr.id]="ids['star']" d="M0-10 2.9-3.1 10-3.1 4.3 1.2 6.2 8.1 0 4-6.2 8.1-4.3 1.2-10-3.1-2.9-3.1Z"/>
    <path [attr.id]="ids['spark']" d="M0-10C1-3 3-1 10 0 3 1 1 3 0 10-1 3-3 1-10 0-3-1-1-3 0-10Z"/>
  </defs>

  <circle class="mg-aura" cx="225" cy="210" r="175" [attr.fill]="refs['aura']"/>
  <ellipse *ngIf="look.head === 'wizard'" class="mg-hat-glow" cx="244" cy="112" rx="160" ry="118" [attr.fill]="refs['hat-glow']"/>
  <ellipse class="mg-shadow" cx="226" cy="362" rx="70" ry="8" fill="#050816" opacity="0.35"/>

  <!-- Estrellas que orbitan (cargando) -->
  <g class="mg-orbit" aria-hidden="true">
    <g transform="translate(62 96) scale(0.9)"><use [attr.href]="hrefs['spark']" class="mg-orbit-star s1" fill="#ffe08a"/></g>
    <g transform="translate(386 150) scale(0.7)"><use [attr.href]="hrefs['spark']" class="mg-orbit-star s2" fill="#d6b4ff"/></g>
    <g transform="translate(372 310) scale(0.6)"><use [attr.href]="hrefs['spark']" class="mg-orbit-star s3" fill="#ffe08a"/></g>
    <g transform="translate(78 330) scale(0.55)"><use [attr.href]="hrefs['spark']" class="mg-orbit-star s4" fill="#d6b4ff"/></g>
  </g>

  <g class="mg-rig">
    <g class="mg-hop">
      <g class="mg-breathe">

        <!-- Capa -->
        <g class="mg-cape">
          <path d="M160 246C141 262 127 294 123 336Q141 345 164 324Z" [attr.fill]="refs['cape']"/>
          <path d="M290 240C319 258 342 298 354 340Q327 347 296 320Z" [attr.fill]="refs['cape']"/>
          <path d="M154 260Q139 293 134 330M308 260Q330 288 343 333" style="stroke: var(--mg-cape-seam)" stroke-width="5" fill="none" opacity="0.35" stroke-linecap="round"/>
          <path d="M126 332Q141 338 160 321M300 321Q328 340 350 336" stroke="#f1c867" stroke-width="2.2" fill="none" opacity="0.8"/>
          <path d="M149 271Q138 304 138 324M311 269Q326 294 334 324" style="stroke: var(--mg-sleeve-hi)" stroke-width="2" stroke-dasharray="2 4" fill="none" opacity="0.6"/>
          <path d="M296 262C313 282 326 306 334 332" style="stroke: var(--mg-cape-seam)" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round"/>
        </g>

        <!-- Cuerpo -->
        <path class="mg-body" [attr.fill]="refs['body']"
          d="M150 226C150 181 176 158 225 158C274 158 300 181 300 226L300 322C300 349 290 360 272 360C252 360 241 352 237 341C233 334 217 334 213 341C209 352 198 360 178 360C160 360 150 349 150 322Z"/>
        <path class="mg-body-shade" [attr.fill]="refs['body-shade']"
          d="M150 226C150 181 176 158 225 158C274 158 300 181 300 226L300 322C300 349 290 360 272 360C252 360 241 352 237 341C233 334 217 334 213 341C209 352 198 360 178 360C160 360 150 349 150 322Z"/>
        <ellipse class="mg-body-highlight" cx="170" cy="282" rx="9" ry="34" fill="#ffffff" opacity="0.07"/>

        <!-- Solapas, forro y bordado: la tela acompaña a la capa equipada. -->
        <g class="mg-garment">
          <path d="M153 256L181 274L171 337Q159 341 151 329Z" [attr.fill]="refs['cape']"/>
          <path d="M295 253L263 275L276 337Q291 340 300 327Z" [attr.fill]="refs['cape']"/>
          <path d="M155 258L180 276L170 330M292 257L264 277L276 330" stroke="#f1c867" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M162 282L157 324M285 281L291 324" style="stroke: var(--mg-cape-seam)" stroke-width="3" fill="none" opacity="0.5"/>
          <path d="M171 333Q225 343 277 333" style="stroke: var(--mg-cape-seam)" stroke-width="5" fill="none"/>
          <rect x="214" y="333" width="21" height="10" rx="3" [attr.fill]="refs['metal']"/>
          <rect x="220" y="336" width="9" height="4" rx="1" style="fill: var(--mg-cape-seam)"/>
          <use [attr.href]="hrefs['star']" transform="translate(166 306) scale(.35)" fill="#f1c867" opacity="0.8"/>
          <use [attr.href]="hrefs['star']" transform="translate(285 306) scale(.35)" fill="#f1c867" opacity="0.8"/>
        </g>

        <!-- Cuello (accesorio): va sobre el cuerpo y bajo la cara; los brazos lo tapan en los hombros -->
        <g class="mg-neck" *ngIf="look.neck === 'scarf-red'">
          <path d="M150 262Q225 286 300 262L300 288Q225 312 150 288Z" [attr.fill]="refs['scarf']"/>
          <path d="M156 270Q225 292 294 270" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.18" stroke-linecap="round"/>
          <path d="M262 284C266 304 270 324 276 340L256 342C252 324 250 304 248 288Z" [attr.fill]="refs['scarf']"/>
          <path d="M258 342v8M264 341v8M270 340v8" stroke="#c0283a" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M153 282Q223 306 297 282" stroke="#86182b" stroke-width="4" fill="none" opacity="0.6"/>
          <path d="M258 296L266 333" stroke="#ffb1a4" stroke-width="2" opacity="0.4"/>
          <path d="M165 275L167 287M182 281L184 294M199 285L201 298M216 287L218 300M233 286L235 299M250 283L252 296M267 279L269 292M284 274L286 287" stroke="#ffcab5" stroke-width="1" opacity="0.3"/>
        </g>
        <g class="mg-neck" *ngIf="look.neck === 'bowtie'">
          <path d="M225 282L199 270Q194 282 199 294Z" fill="#c0283a"/>
          <path d="M225 282L251 270Q256 282 251 294Z" fill="#c0283a"/>
          <path d="M203 275Q200 282 203 289M247 275Q250 282 247 289" stroke="#8e1b2b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <rect x="219" y="276" width="12" height="12" rx="3" fill="#8e1b2b"/>
          <path d="M201 273L215 281L201 289M249 273L235 281L249 289" stroke="#ff9b99" stroke-width="1.3" fill="none" opacity="0.55"/>
          <rect x="221" y="277" width="8" height="9" rx="2" [attr.fill]="refs['scarf']"/>
        </g>

        <!-- Cara: se desplaza un poco hacia donde mira (giro de cabeza) -->
        <g class="mg-face">
          <g class="mg-eye" [attr.clip-path]="refs['eye-l']">
            <circle cx="182" cy="215" r="26" [attr.fill]="refs['sclera']"/>
            <g class="mg-pupil">
              <circle cx="186" cy="212" r="15.5" [attr.fill]="refs['iris']"/>
              <circle cx="186" cy="212" r="8" fill="#150b05"/>
              <circle cx="190.5" cy="207" r="4.2" fill="#ffffff"/>
              <circle cx="182.5" cy="216.5" r="1.8" fill="#ffffff" opacity="0.8"/>
            </g>
            <rect class="mg-lid" x="152" y="187" width="60" height="58" [attr.fill]="refs['lid']"/>
            <rect class="mg-lid-low" x="152" y="187" width="60" height="58" [attr.fill]="refs['lid']"/>
          </g>
          <g class="mg-eye" [attr.clip-path]="refs['eye-r']">
            <circle cx="252" cy="215" r="26" [attr.fill]="refs['sclera']"/>
            <g class="mg-pupil">
              <circle cx="249" cy="212" r="15.5" [attr.fill]="refs['iris']"/>
              <circle cx="249" cy="212" r="8" fill="#150b05"/>
              <circle cx="253.5" cy="207" r="4.2" fill="#ffffff"/>
              <circle cx="245.5" cy="216.5" r="1.8" fill="#ffffff" opacity="0.8"/>
            </g>
            <rect class="mg-lid" x="222" y="187" width="60" height="58" [attr.fill]="refs['lid']"/>
            <rect class="mg-lid-low" x="222" y="187" width="60" height="58" [attr.fill]="refs['lid']"/>
          </g>

          <!-- Gafas redondas (las de siempre) -->
          <g *ngIf="look.eyes === 'round'" class="mg-glasses" fill="none" stroke-linecap="round">
            <circle cx="182" cy="215" r="25.5" [attr.fill]="refs['lens']" stroke="none"/>
            <circle cx="252" cy="215" r="25.5" [attr.fill]="refs['lens']" stroke="none"/>
            <path d="M162 201A22 22 0 0 1 180 193" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
            <path d="M232 201A22 22 0 0 1 250 193" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
            <circle cx="182" cy="215" r="28" stroke="#18215a" stroke-width="5"/>
            <circle cx="252" cy="215" r="28" stroke="#18215a" stroke-width="5"/>
            <circle cx="182" cy="215" r="25.6" stroke="#6576c9" stroke-width="1" opacity="0.55"/>
            <circle cx="252" cy="215" r="25.6" stroke="#6576c9" stroke-width="1" opacity="0.55"/>
            <path d="M210 214Q217 207 224 214" stroke="#18215a" stroke-width="4.5"/>
            <path d="M154 212 150 209" stroke="#18215a" stroke-width="4"/>
            <path d="M280 212 299 205" stroke="#18215a" stroke-width="4"/>
            <path class="mg-lens-shine" d="M166 210L178 198M239 212L254 197" stroke="#ffffff" stroke-width="3" opacity="0.32"/>
            <circle cx="153" cy="210" r="2.5" [attr.fill]="refs['metal']" stroke="none"/>
            <circle cx="282" cy="210" r="2.5" [attr.fill]="refs['metal']" stroke="none"/>
          </g>
          <!-- Monóculo del erudito -->
          <g *ngIf="look.eyes === 'monocle'" class="mg-eyewear" fill="none" stroke-linecap="round">
            <circle cx="252" cy="215" r="29" [attr.stroke]="refs['metal']" stroke-width="5" [attr.fill]="refs['lens']"/>
            <circle cx="252" cy="215" r="25.7" stroke="#fff0b8" stroke-width="1" opacity="0.55"/>
            <path d="M232 203A22 22 0 0 1 250 193" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
            <path d="M279 226C292 250 290 276 280 300" stroke="#d4a72c" stroke-width="1.6" stroke-dasharray="2.5 3"/>
            <circle cx="279" cy="227" r="3" [attr.fill]="refs['metal']" stroke="#8d5f26" stroke-width="1"/>
            <path class="mg-lens-shine" d="M238 215L254 199" stroke="#ffffff" stroke-width="3" opacity="0.32"/>
            <circle cx="280" cy="301" r="4" [attr.fill]="refs['metal']" stroke="#8d5f26" stroke-width="1"/>
          </g>
          <!-- Gafas de media luna -->
          <g *ngIf="look.eyes === 'halfmoon'" class="mg-eyewear" [attr.stroke]="refs['metal']" stroke-linecap="round" stroke-linejoin="round">
            <path d="M156 218A26 26 0 0 0 208 218Z" stroke-width="4" [attr.fill]="refs['lens']"/>
            <path d="M226 218A26 26 0 0 0 278 218Z" stroke-width="4" [attr.fill]="refs['lens']"/>
            <path d="M208 220Q217 214 226 220M156 218 150 214M278 218 299 210" stroke-width="3.5" fill="none"/>
            <path class="mg-lens-shine" d="M164 223Q170 235 180 237M234 223Q240 235 250 237" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.45"/>
          </g>
          <!-- Gafas estelares -->
          <g *ngIf="look.eyes === 'star'" class="mg-eyewear" stroke="#ff5fa8" stroke-linejoin="round" stroke-linecap="round">
            <use [attr.href]="hrefs['star']" transform="translate(182 215) scale(3.3)" fill="#ff8fc7" fill-opacity="0.18" stroke-width="1.3"/>
            <use [attr.href]="hrefs['star']" transform="translate(252 215) scale(3.3)" fill="#ff8fc7" fill-opacity="0.18" stroke-width="1.3"/>
            <path d="M212 212Q217 206 222 212" stroke-width="4" fill="none"/>
            <path d="M154 207L147 203M280 208L300 202" stroke="#c44180" stroke-width="3.5" fill="none"/>
            <path class="mg-lens-shine" d="M172 210L181 201M243 210L252 201" stroke="#ffdce9" stroke-width="3" opacity="0.6"/>
          </g>

          <!-- Boca: sonrisa / abierta / concentrada -->
          <path class="mg-mouth mg-mouth-smile" d="M207 244Q216 252 225 244" stroke="#141c50" stroke-width="3.4" stroke-linecap="round" fill="none"/>
          <g class="mg-mouth mg-mouth-open">
            <path d="M204 240Q216 264 228 240Q216 246 204 240Z" fill="#3a0f25"/>
            <path d="M209 251Q216 257 223 251Q216 247 209 251Z" fill="#ec6f86"/>
          </g>
          <ellipse class="mg-mouth mg-mouth-o" cx="216" cy="246" rx="4" ry="5" fill="#3a0f25"/>

          <!-- Cara (accesorio): la barba nace bajo la boca para que siga a la vista -->
          <g *ngIf="look.face === 'beard'" class="mg-facial">
            <path d="M172 248C172 266 166 276 174 293C173 303 185 308 184 315C197 322 204 340 216 346C229 337 236 321 246 315C245 308 259 301 259 291C266 274 259 260 259 248C250 261 235 274 216 269C199 273 181 261 172 248Z" [attr.fill]="refs['beard']" stroke="#bec9e2" stroke-width="1.2"/>
            <path d="M178 264Q178 284 190 295M188 280Q188 306 205 322M216 281Q208 309 216 337M243 273Q251 289 239 302M240 293Q237 316 224 330" stroke="#9caaca" stroke-width="2.2" fill="none" opacity="0.65" stroke-linecap="round"/>
            <path d="M180 269Q182 282 189 287M197 282Q195 303 207 315M224 282Q223 299 220 309M248 267Q253 282 248 288M232 299Q230 313 223 321" stroke="#ffffff" stroke-width="2.4" fill="none" opacity="0.75" stroke-linecap="round"/>
            <path d="M174 252Q186 271 198 274M258 252Q245 271 234 275" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
          </g>
          <g *ngIf="look.face === 'mustache'" class="mg-facial">
            <path d="M216 246C210 237 200 237 194 244C187 251 181 247 183 240C177 242 176 251 183 255C191 263 206 257 216 252C227 258 242 263 250 254C256 248 253 241 248 240C252 247 243 250 238 244C232 237 222 237 216 246Z" [attr.fill]="refs['mustache']" stroke="#36241f" stroke-width="1.2"/>
            <path d="M213 247Q202 241 197 248Q187 257 182 248M220 247Q231 241 237 248Q246 255 250 248" stroke="#c79b70" stroke-width="1.6" fill="none" opacity="0.65" stroke-linecap="round"/>
          </g>
        </g>

        <!-- Sombrero: el de mago es el de siempre; los demás se compran en El Bazar.
             Todos comparten el pivote y las animaciones de .mg-hat. -->
        <g class="mg-hat" [ngSwitch]="look.head">
          <!-- Corona del Rey Lector -->
          <g *ngSwitchCase="'crown'">
            <path d="M180 164L172 118L200 140L212 104L225 136L238 104L250 140L278 118L270 164Z" [attr.fill]="refs['crown']"/>
