<div class="lit-assistant-root"
     [class.is-mobile]="isMobile"
     [class.is-scrolled-down]="isScrolledDown"
     [class.is-input-focused]="isInputFocused"
     [class.speed-dial-open]="isMobileSpeedDialOpen">

  <!-- BACKDROP SUTIL EN MÓVIL AL ABRIR EL SPEED DIAL -->
  <div class="lit-mobile-backdrop"
       *ngIf="isMobile && isMobileSpeedDialOpen"
       (click)="closeMobileSpeedDial()"
       aria-hidden="true">
  </div>

  <!-- MENÚ SPEED DIAL DESPLEGADO HACIA ARRIBA (SOLO MÓVIL) -->
  <div class="lit-speed-dial-menu" *ngIf="isMobile && isMobileSpeedDialOpen" role="menu" aria-label="Herramientas rápidas">
    <!-- Opción Cuaderno de Notas -->
    <button type="button"
            class="lit-speed-dial-item item-notebook"
            (click)="openNotebookFromSpeedDial()"
            role="menuitem"
            title="Abrir cuaderno de notas y apuntes">
      <span class="lit-speed-dial-icon material-symbols-rounded">stylus_note</span>
      <span class="lit-speed-dial-label">Cuaderno</span>
    </button>

    <!-- Opción Asistente Virtual -->
    <button type="button"
            class="lit-speed-dial-item item-assistant"
            (click)="openAssistantFromSpeedDial()"
            role="menuitem"
            title="Abrir Asistente Virtual">
      <span class="lit-speed-dial-icon material-symbols-rounded">auto_awesome</span>
      <span class="lit-speed-dial-label">Asistente</span>
      <span class="lit-speed-dial-ping" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
    </button>
  </div>

  <!-- BURBUJA FLOTANTE UNIFICADA -->
  <button
    type="button"
    class="lit-bubble"
    [hidden]="isOpen"
    [class.bouncing]="isBouncing"
    [class.is-active-dial]="isMobile && isMobileSpeedDialOpen"
    (click)="onBubbleClick()"
    [attr.aria-expanded]="isMobile ? isMobileSpeedDialOpen : null"
    [attr.aria-label]="isMobile ? (isMobileSpeedDialOpen ? 'Cerrar opciones' : 'Abrir opciones de asistente y cuaderno') : 'Abrir el Asistente de Literatus'">
    
    <!-- En móvil cuando el Speed Dial está abierto, muestra ícono de cerrar -->
    <span class="lit-dial-close-icon material-symbols-rounded" *ngIf="isMobile && isMobileSpeedDialOpen" aria-hidden="true">
      close
    </span>

    <ng-container *ngIf="!isMobile || !isMobileSpeedDialOpen">
      <span class="lit-bubble-glow"></span>
      <span class="lit-bubble-orbit-ring" aria-hidden="true">
        <span class="lit-orbit-star">✦</span>
      </span>
      <div class="lit-bubble-avatar">
        <!-- Siempre a la vista: modo calmado (parpadea y te sigue con la mirada) -->
        <app-maguito class="lit-mascot-avatar" crop="bust" [mine]="true" [calm]="true" [interactive]="false"></app-maguito>
      </div>
      <span class="lit-bubble-tooltip" aria-hidden="true">¡Hola! ¿Leemos algo? ✨</span>
      <span class="lit-bubble-ping" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
    </ng-container>
  </button>

  <!-- PANEL DE CONVERSACIÓN -->
  <section
    class="lit-panel"
    *ngIf="isOpen"
    [@slideUpPanel]
    role="dialog"
    aria-label="Asistente de Literatus Novelist">

    <header class="lit-panel-header">
      <div class="lit-header-identity">
        <!-- Saluda al abrir, agita la pluma mientras piensa y celebra cuando llega la respuesta -->
        <div class="lit-header-avatar-wrap">
          <app-maguito class="lit-header-mascot" crop="bust" [mine]="true" [interactive]="false"
                       [state]="isSending ? 'loading' : mascotState"></app-maguito>
        </div>
        <div class="lit-header-texts">
          <span class="lit-header-title">Asistente Literatus</span>
          <span class="lit-header-subtitle">{{ currentSection }}</span>
        </div>
      </div>
      <div class="lit-header-actions">
        <button type="button" class="lit-icon-btn" [class.active]="isHistoryOpen" (click)="toggleHistory()" title="Conversaciones anteriores" aria-label="Ver conversaciones anteriores">
          <span class="material-symbols-rounded">history</span>
        </button>
        <button type="button" class="lit-icon-btn" [class.active]="isEphemeral" (click)="toggleEphemeral()" title="Modo efímero (sin guardar)" aria-label="Modo efímero">
          <span class="material-symbols-rounded">visibility_off</span>
        </button>
        <button type="button" class="lit-icon-btn" (click)="newConversation()" title="Nueva conversación" aria-label="Nueva conversación">
          <span class="material-symbols-rounded">add_comment</span>
        </button>
        <button type="button" class="lit-icon-btn" (click)="minimize()" title="Minimizar" aria-label="Minimizar el asistente">
          <span class="material-symbols-rounded">remove</span>
        </button>
        <button type="button" class="lit-icon-btn" (click)="close()" title="Cerrar" aria-label="Cerrar el asistente">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
    </header>

    <!-- HISTORIAL DE CONVERSACIONES -->
    <div class="lit-history-drawer" *ngIf="isHistoryOpen">
      <div class="lit-history-list">
        <div
          class="lit-history-row"
          *ngFor="let c of conversations; trackBy: trackByConversation"
          [class.active]="c.id === activeConversationId"
          [class.confirming]="c.id === confirmingDeleteId">
          <ng-container *ngIf="c.id !== confirmingDeleteId; else confirmDeleteTpl">
            <button type="button" class="lit-history-item" (click)="selectConversation(c)">
              <span class="lit-history-item-title">{{ c.title || 'Nueva conversación' }}</span>
              <span class="lit-history-item-preview" *ngIf="c.last_message">{{ c.last_message }}</span>
            </button>
            <!-- Mientras el Asistente responde en esta conversación no se puede borrar -->
            <button
              type="button"
              class="lit-history-delete"
              (click)="askDelete(c)"
              [disabled]="isSending && c.id === activeConversationId"
              title="Eliminar conversación"
              [attr.aria-label]="'Eliminar la conversación ' + (c.title || 'Nueva conversación')">
              <span class="material-symbols-rounded">delete</span>
            </button>
          </ng-container>

          <ng-template #confirmDeleteTpl>
            <div class="lit-history-confirm" role="group" aria-label="Confirmar eliminación">
              <span class="lit-history-confirm-text">¿Eliminar «{{ c.title || 'Nueva conversación' }}»? No se puede deshacer.</span>
              <div class="lit-history-confirm-actions">
                <button type="button" class="lit-confirm-btn" (click)="cancelDelete()" [disabled]="deletingId === c.id">Cancelar</button>
                <button type="button" class="lit-confirm-btn lit-confirm-btn--danger" (click)="confirmDelete(c)" [disabled]="deletingId === c.id">
                  {{ deletingId === c.id ? 'Eliminando…' : 'Eliminar' }}
                </button>
              </div>
            </div>
          </ng-template>
        </div>
        <p class="lit-history-empty" *ngIf="conversations.length === 0">Aún no tienes conversaciones anteriores.</p>
      </div>
    </div>

    <!-- MENSAJES -->
    <div class="lit-messages" #messagesEl *ngIf="!isHistoryOpen">
      <div class="lit-ephemeral-notice" *ngIf="isEphemeral">
        <span class="lit-ephemeral-text">Has entrado en modo efímero</span>
        <div class="lit-ephemeral-separator"></div>
      </div>

      <div
        *ngFor="let msg of messages; trackBy: trackByMessage"
        [class]="'lit-msg ' + (msg.role === 'user' ? 'lit-msg--user' : 'lit-msg--assistant')">
        <div class="lit-msg-bubble" *ngIf="!msg.pending">{{ msg.content }}</div>
        <div class="lit-msg-bubble lit-typing" *ngIf="msg.pending">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- ENTRADA DE TEXTO -->
    <footer class="lit-input-bar" *ngIf="!isHistoryOpen">
      <textarea
        class="lit-input"
        enterkeyhint="send"
        rows="1"
        maxlength="1000"
        placeholder="Escribe tu pregunta sobre Literatus..."
        [(ngModel)]="draft"
        (keydown)="onKeydown($event)"
        [disabled]="isSending"
        aria-label="Escribe tu pregunta para el Asistente"></textarea>
      <button
        type="button"
        class="lit-mic-btn"
        [class.listening]="isListening"
        (click)="toggleVoiceInput()"
        [title]="isListening ? 'Escuchando... Haz clic para detener' : 'Dictar por voz'"
        [disabled]="isSending"
        aria-label="Dictar por voz">
        <span class="material-symbols-rounded">{{ isListening ? 'mic' : 'mic_none' }}</span>
      </button>
      <button
        type="button"
        class="lit-send-btn"
        (click)="send()"
        [disabled]="isSending || !draft.trim()"
        aria-label="Enviar mensaje">
        <span class="material-symbols-rounded">send</span>
      </button>
    </footer>

  </section>
</div>
