<div class="rd-more-backdrop" (click)="close()" aria-hidden="true"></div>
<section class="rd-more-sheet" id="reader-more-sheet" role="dialog" aria-modal="true" aria-labelledby="reader-more-title"
         rdSheet (rdSheetClose)="close()" rdFocusTrap>
  <span class="sheet-grabber" aria-hidden="true" data-sheet-grip></span>
  <header class="rd-more-header" data-sheet-grip>
    <h2 id="reader-more-title">Más</h2>
    <button type="button" class="rd-more-close" (click)="close()" aria-label="Cerrar más opciones">
      <span class="material-symbols-rounded" aria-hidden="true">close</span>
    </button>
  </header>

  <div class="rd-more-content">
    <div class="rd-more-actions">
      <button type="button" class="rd-more-action" (click)="act('characters')">
        <span class="material-symbols-rounded" aria-hidden="true">group</span><span>Personajes</span>
      </button>
      <button type="button" class="rd-more-action" (click)="act('notebook')">
        <span class="material-symbols-rounded" aria-hidden="true">stylus_note</span><span>Cuaderno</span>
      </button>
      <button type="button" class="rd-more-action" (click)="act('vocabulary')">
        <span class="material-symbols-rounded" aria-hidden="true">dictionary</span><span>Vocabulario</span>
      </button>
      <button type="button" class="rd-more-action" (click)="act('summary')">
        <span class="material-symbols-rounded" aria-hidden="true">history_edu</span><span>Resumen hasta donde voy</span>
      </button>
      <button type="button" class="rd-more-action" (click)="act('postit')">
        <span class="material-symbols-rounded" aria-hidden="true">sticky_note_2</span><span>Pegar post-it</span>
      </button>
      <button type="button" class="rd-more-action" (click)="act('favorite')" [attr.aria-pressed]="r.isFavoriteBook">
        <span class="material-symbols-rounded" [class.rd-filled]="r.isFavoriteBook" aria-hidden="true">star</span>
        <span>{{ r.isFavoriteBook ? 'Quitar de favoritos' : 'Agregar a favoritos' }}</span>
      </button>
      <button type="button" class="rd-more-action" (click)="act('report')">
        <span class="material-symbols-rounded" aria-hidden="true">report_problem</span>
        <span>Reportar error</span>
      </button>
    </div>

    <section class="rd-open-books" aria-labelledby="reader-open-books-title">
      <h3 id="reader-open-books-title">Libros abiertos</h3>
      <ul class="rd-open-books-list">
        <li class="rd-open-book" *ngFor="let tab of tabsService.tabs; trackBy: trackTab" [class.is-current]="tab.id === r.inventoryId">
          <button type="button" class="rd-open-book-select" (click)="selectTab(tab)" [attr.aria-current]="tab.id === r.inventoryId ? 'page' : null">
            <span class="material-symbols-rounded rd-book-icon" aria-hidden="true">auto_stories</span>
            <span class="rd-open-book-text"><span class="rd-open-book-title">{{ tab.title }}</span><span class="rd-open-book-author" *ngIf="tab.author">{{ tab.author }}</span></span>
            <span class="rd-current-label" *ngIf="tab.id === r.inventoryId">Leyendo</span>
          </button>
          <button type="button" class="rd-open-book-close" (click)="closeTab(tab, $event)" [attr.aria-label]="'Cerrar ' + tab.title" [title]="'Cerrar ' + tab.title">
            <span class="material-symbols-rounded" aria-hidden="true">close</span>
          </button>
        </li>
      </ul>
      <p class="rd-empty-books" *ngIf="!tabsService.tabs.length">Los libros que abras aparecerán aquí.</p>
    </section>
  </div>
</section>
