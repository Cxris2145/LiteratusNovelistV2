<div class="ts-stage" role="img" [attr.aria-label]="summary">
  <!-- Capa de ambiente: resplandor cálido de velas y faroles -->
  <div class="ts-ambient-light" aria-hidden="true">
    <div class="ts-hearth-glow"></div>
    <div class="ts-candle c1"><span class="ts-flame"></span></div>
    <div class="ts-candle c2"><span class="ts-flame"></span></div>
  </div>

  <!-- Partículas de reacciones flotantes (🍺, ❤️, 👏, 📖, ✨) -->
  <div class="ts-particles-layer" aria-hidden="true">
    <div *ngFor="let p of particles; trackBy: trackParticle" class="ts-floating-particle" [style.left.%]="p.x">
      <span class="ts-emoji-float">{{ p.emoji }}</span>
    </div>
  </div>

  <!-- Maguitos sentados alrededor de la mesa con sus atuendos -->
  <div *ngFor="let seat of seats; trackBy: trackSeat" class="ts-seat" [ngClass]="'seat-' + seat.slot">
    <!-- Bocadillo de diálogo (chat o frase temática con emojis) -->
    <div class="ts-bubble" *ngIf="seat.bubble" [class.is-chat]="seat.bubble.isChat" aria-hidden="true">
      <span *ngIf="seat.bubble.isChat" class="material-symbols-rounded ts-chat-indicator">chat_bubble</span>
      <span class="ts-bubble-text">{{ seat.bubble.text }}</span>
    </div>

    <app-maguito
      [outfit]="seat.guest.outfit"
      [mug]="seat.mug"
      [toasting]="toasting"
      [greetOnEnter]="seat.isMe"
      [followPointer]="seat.isMe"
      [interactive]="true">
    </app-maguito>
  </div>

  <!-- Mesa de primer plano con libros, pergaminos, farol, jarras y el gato negro -->
  <svg class="ts-table-overlay" viewBox="0 0 1000 320" focusable="false" aria-hidden="true">
    <defs>
      <linearGradient id="ts-table-wood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#804d26"/>
        <stop offset="0.4" stop-color="#5a3419"/>
        <stop offset="1" stop-color="#321c0e"/>
      </linearGradient>
      <linearGradient id="ts-table-rim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#a66e3b"/>
        <stop offset="1" stop-color="#462512"/>
      </linearGradient>
      <radialGradient id="ts-lantern-glow-center" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#ffd56b" stop-opacity="0.95"/>
        <stop offset="0.35" stop-color="#ff9e3b" stop-opacity="0.45"/>
        <stop offset="1" stop-color="#ff9e3b" stop-opacity="0"/>
      </radialGradient>
      <filter id="ts-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>

    <!-- Superficie redondeada de la mesa de roble -->
    <ellipse cx="500" cy="190" rx="460" ry="110" fill="url(#ts-table-wood)"/>
    <ellipse cx="500" cy="186" rx="454" ry="104" fill="none" stroke="url(#ts-table-rim)" stroke-width="4" opacity="0.6"/>
    <!-- Vetas de madera -->
    <path d="M120 188Q340 215 500 210Q660 205 880 184" stroke="#2c170c" stroke-width="2.5" fill="none" opacity="0.4"/>
    <path d="M180 168Q380 190 520 186Q680 182 820 164" stroke="#2c170c" stroke-width="1.8" fill="none" opacity="0.3"/>

    <!-- Resplandor del farol central de mesa -->
    <circle class="ts-lantern-halo" cx="500" cy="136" r="140" fill="url(#ts-lantern-glow-center)"/>

    <!-- Pergaminos y libro abierto en el centro-izquierda -->
    <g transform="translate(390, 160) scale(0.85)">
      <!-- Pergaminos enrollados -->
      <rect x="-80" y="-34" width="70" height="18" rx="6" fill="#f4ebd0"/>
      <ellipse cx="-80" cy="-25" rx="5" ry="9" fill="#dfd2b0"/>
      <ellipse cx="-10" cy="-25" rx="5" ry="9" fill="#f4ebd0"/>
      <path d="M-50 -34V-16" stroke="#93282b" stroke-width="3"/>
      <!-- Libro abierto antiguo -->
      <path d="M-60 6Q-30 -10 0 4V34Q-30 20 -60 36Z" fill="#faf3e0"/>
      <path d="M60 6Q30 -10 0 4V34Q30 20 60 36Z" fill="#efe4c8"/>
      <path d="M0 4V36" stroke="#8a6d3b" stroke-width="2.5"/>
      <!-- Líneas de texto mágico manuscrito -->
      <path d="M-50 12Q-30 4 -10 10M-50 18Q-30 10 -10 16M-50 24Q-30 16 -10 22" stroke="#8c7853" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
      <path d="M10 10Q30 4 50 12M10 16Q30 10 50 18M10 22Q30 16 50 24" stroke="#8c7853" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>

    <!-- Farol central de bronce con vidrio y llama viva -->
    <g transform="translate(500, 150)">
      <!-- Base y cúpula -->
      <path d="M-18 20L18 20L14 26L-14 26Z" fill="#2d1c11"/>
      <rect x="-15" y="-36" width="30" height="56" rx="4" fill="#ffd470" opacity="0.88"/>
      <!-- Varillas de hierro -->
      <path d="M-15 -36V20M15 -36V20M0 -36V20" stroke="#2d1c11" stroke-width="3"/>
      <path d="M-18 -36H18L12 -46H-12Z" fill="#2d1c11"/>
      <!-- Aro de sujeción -->
      <path d="M-7 -46Q0 -58 7 -46" stroke="#2d1c11" stroke-width="3" fill="none"/>
      <!-- Llama interior que oscila -->
      <ellipse class="ts-table-flame" cx="0" cy="-6" rx="6" ry="12" fill="#fffbe6"/>
      <ellipse class="ts-table-flame" cx="0" cy="-4" rx="3.5" ry="7" fill="#ffb703"/>
    </g>

    <!-- Libros apilados y tintero con pluma en centro-derecha -->
    <g transform="translate(615, 175) scale(0.85)">
      <!-- Libro de cuero granate -->
      <rect x="-40" y="8" width="80" height="14" rx="3" fill="#6a1b29"/>
      <rect x="-38" y="2" width="76" height="8" rx="2" fill="#224263"/>
      <rect x="-35" y="-4" width="70" height="8" rx="2" fill="#c48b28"/>
      <!-- Tintero con pluma -->
      <ellipse cx="48" cy="12" rx="10" ry="7" fill="#1f2421"/>
      <path d="M48 6Q58 -22 68 -48" stroke="#d4af37" stroke-width="2" fill="none"/>
      <path d="M68 -48C64 -40 60 -26 50 -10" stroke="#f4f1de" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- El gato negro de la taberna con bufanda roja sobre la mesa -->
    <g class="ts-cat" transform="translate(715, 170) scale(0.82)">
      <!-- Cuerpo del gato -->
      <ellipse cx="0" cy="16" rx="22" ry="15" fill="#1b1624"/>
      <!-- Cola sinuosa que se mueve -->
      <path class="ts-cat-tail" d="M-18 20Q-34 14 -32 -2Q-30 -16 -20 -12Q-22 -4 -14 14" stroke="#1b1624" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- Cabeza -->
      <circle cx="0" cy="-6" r="18" fill="#1b1624"/>
      <!-- Orejitas puntiagudas -->
      <path d="M-14 -16L-8 -30L-2 -18Z" fill="#1b1624"/>
      <path d="M-12 -17L-8 -26L-4 -18Z" fill="#e76f51" opacity="0.6"/>
      <path d="M2 -18L8 -30L14 -16Z" fill="#1b1624"/>
      <path d="M4 -18L8 -26L12 -17Z" fill="#e76f51" opacity="0.6"/>
      <!-- Ojos grandes dorados curiosos -->
      <ellipse cx="-7" cy="-7" rx="4.5" ry="5.5" fill="#ffd166"/>
      <ellipse cx="-7" cy="-7" rx="1.8" ry="4" fill="#0d0a14"/>
      <circle cx="-5.5" cy="-9" r="1.4" fill="#ffffff"/>
      <ellipse cx="7" cy="-7" rx="4.5" ry="5.5" fill="#ffd166"/>
      <ellipse cx="7" cy="-7" rx="1.8" ry="4" fill="#0d0a14"/>
      <circle cx="8.5" cy="-9" r="1.4" fill="#ffffff"/>
      <!-- Hocico y bigotitos finos -->
      <path d="M-2 -1L0 1L2 -1" stroke="#e76f51" stroke-width="1.2" fill="none"/>
      <path d="M-8 1L-20 -1M-8 3L-21 4M8 1L20 -1M8 3L21 4" stroke="#e0e1dd" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
      <!-- Bufanda roja abrigada con nudo -->
      <path d="M-16 5Q0 14 16 5L14 14Q0 22 -14 14Z" fill="#c0283a"/>
      <path d="M4 10L8 25L0 25L-2 10Z" fill="#c0283a"/>
      <path d="M0 25V29M4 25V29M7 25V29" stroke="#8e1b2b" stroke-width="1.6"/>
    </g>

    <!-- Jarra de madera en la mesa para la izquierda -->
    <g transform="translate(305, 172) scale(0.72)">
      <path d="M22 -8Q40 -8 40 10Q40 26 22 26" stroke="#c8902a" stroke-width="7" fill="none"/>
      <rect x="-22" y="-20" width="44" height="54" rx="8" fill="#804d26"/>
      <rect x="-22" y="-12" width="44" height="5" fill="#462512"/>
      <rect x="-22" y="18" width="44" height="5" fill="#462512"/>
      <ellipse cx="0" cy="-20" rx="24" ry="9" fill="#fff4dc"/>
    </g>

    <!-- Jarra de madera en la mesa para la derecha -->
    <g transform="translate(680, 185) scale(0.72)">
      <path d="M-22 -8Q-40 -8 -40 10Q-40 26 -22 26" stroke="#b07a3a" stroke-width="7" fill="none"/>
      <rect x="-22" y="-20" width="44" height="54" rx="8" fill="#6d3e1b"/>
      <rect x="-22" y="-12" width="44" height="5" fill="#3b1d09"/>
      <rect x="-22" y="18" width="44" height="5" fill="#3b1d09"/>
      <ellipse cx="0" cy="-20" rx="24" ry="9" fill="#fff4dc"/>
    </g>
  </svg>

  <!-- Cartelitos con el nombre sobre la mesa, con punto de estado y corona si es 1° lugar -->
  <span *ngFor="let seat of seats; trackBy: trackSeat" class="ts-name" [ngClass]="'seat-' + seat.slot" aria-hidden="true">
    <span class="th-dot" [ngClass]="seat.isMe ? 'tavern' : (seat.guest.status?.kind || 'tavern')"></span>
    <span class="ts-name-text">{{ seat.isMe ? (demo ? seat.guest.username : (me?.username || 'Tú')) : seat.guest.username }}</span>
    <span *ngIf="seat.isFirst" class="ts-name-crown" title="Primer lugar del ranking">👑</span>
  </span>

  <span class="ts-more wide" *ngIf="extraWide" aria-hidden="true">+{{ extraWide }} en la lista</span>

  <!-- ============================================================ -->
  <!-- BARRA DE CHAT Y REACCIONES RÁPIDAS DE LA TABERNA             -->
  <!-- ============================================================ -->
  <footer class="ts-chat-dock">
    <div class="ts-chat-bar">
      <span class="material-symbols-rounded ts-chat-lead-icon" aria-hidden="true">chat</span>

      <input
        type="text"
        class="ts-chat-input"
        [(ngModel)]="chatText"
        (keydown.enter)="sendChat()"
        placeholder="Comparte un mensaje en la taberna…"
        maxlength="200"
        [disabled]="busySending"
        aria-label="Mensaje para la mesa"
      />

      <div class="ts-chat-tools">
        <!-- Selector rápido de emojis -->
        <div class="ts-emoji-picker-wrap" *ngIf="showEmojiList">
          <div class="ts-emoji-grid">
            <button *ngFor="let em of quickEmojis" type="button" class="ts-emoji-pick-btn" (click)="insertEmoji(em)">
              {{ em }}
            </button>
          </div>
        </div>

        <button type="button" class="ts-chat-icon-btn" (click)="toggleEmojiList()" title="Añadir emoji" aria-label="Añadir emoji">
          <span class="material-symbols-rounded" aria-hidden="true">mood</span>
        </button>

        <!-- Botón enviar circular dorado con flecha -->
        <button
          type="button"
          class="ts-chat-send-btn"
          (click)="sendChat()"
          [disabled]="!chatText.trim() || busySending"
          title="Enviar mensaje"
          aria-label="Enviar mensaje"
        >
          <span class="material-symbols-rounded" aria-hidden="true">send</span>
        </button>
      </div>

      <!-- Divisor hacia las reacciones rápidas -->
      <div class="ts-dock-separator" aria-hidden="true"></div>

      <!-- Reacciones rápidas: 🍺 ❤️ 👏 📖 ✨ -->
      <div class="ts-dock-reactions">
        <span class="ts-dock-reactions-label">Reacciones</span>
        <div class="ts-dock-reactions-list">
          <button type="button" class="ts-react-pill" (click)="react('🍺')" title="Brindar por las lecturas" aria-label="Brindar con cerveza">
            🍺
          </button>
          <button type="button" class="ts-react-pill" (click)="react('❤️')" title="Me encanta" aria-label="Corazón">
            ❤️
          </button>
          <button type="button" class="ts-react-pill" (click)="react('👏')" title="¡Gran logro!" aria-label="Aplausos">
            👏
          </button>
          <button type="button" class="ts-react-pill" (click)="react('📖')" title="Buena lectura" aria-label="Libro">
            📖
          </button>
          <button type="button" class="ts-react-pill" (click)="react('✨')" title="Magia literaria" aria-label="Destellos">
            ✨
          </button>
        </div>
      </div>
    </div>
  </footer>
</div>
