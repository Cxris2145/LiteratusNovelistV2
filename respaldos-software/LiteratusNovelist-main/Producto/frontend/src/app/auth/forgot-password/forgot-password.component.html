<div class="auth-wrapper">
  <div class="glass-panel auth-card">
    <h2 class="auth-title">Recuperar Contraseña</h2>
    <p style="color: var(--text-muted); text-align: center; margin-bottom: 2rem;">
      Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
    </p>

    <div *ngIf="message" style="background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; text-align: center;">
      {{ message }}
    </div>

    <div *ngIf="error" style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; text-align: center;">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" *ngIf="!message">
      <div class="input-group">
        <label for="email" class="glass-label">Correo Electrónico</label>
        <div class="input-wrapper">
          <span class="material-symbols-rounded input-icon">mail</span>
          <input type="email" id="email" name="email" [(ngModel)]="email" class="glass-input" required placeholder="tu@correo.com">
        </div>
      </div>

      <button type="submit" class="glass-btn primary-btn" style="margin-top: 1rem;" [disabled]="isLoading || !email">
        <span *ngIf="!isLoading">Enviar Enlace de Recuperación</span>
        <span *ngIf="isLoading" class="material-symbols-rounded spinning">sync</span>
      </button>
    </form>
    
    <div class="auth-footer">
      <p><a routerLink="/login" class="glow-link">Volver al inicio de sesión</a></p>
    </div>
  </div>
</div>
