<div class="auth-wrapper">
  <div class="glass-panel auth-card">
    <h2 class="auth-title">Crear Nueva Contraseña</h2>
    
    <div *ngIf="message" style="background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; text-align: center;">
      {{ message }}
      <div style="margin-top: 1rem;">
        <button class="glass-btn primary-btn" routerLink="/login">Ir a Iniciar Sesión</button>
      </div>
    </div>

    <div *ngIf="error" style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; text-align: center;">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" *ngIf="!message && !isInvalidLink">
      <div class="input-group">
        <label for="newPassword" class="glass-label">Nueva Contraseña</label>
        <div class="input-wrapper">
          <span class="material-symbols-rounded input-icon">lock</span>
          <input type="password" id="newPassword" name="newPassword" [(ngModel)]="newPassword" class="glass-input" required minlength="8" placeholder="Mínimo 8 caracteres">
        </div>
      </div>

      <div class="input-group" style="margin-top: 1.5rem;">
        <label for="confirmPassword" class="glass-label">Confirmar Contraseña</label>
        <div class="input-wrapper">
          <span class="material-symbols-rounded input-icon">lock_clock</span>
          <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" class="glass-input" required placeholder="Repite tu contraseña">
        </div>
      </div>

      <button type="submit" class="glass-btn primary-btn" style="margin-top: 2rem;" [disabled]="isLoading || !newPassword || !confirmPassword">
        <span *ngIf="!isLoading">Guardar Contraseña</span>
        <span *ngIf="isLoading" class="material-symbols-rounded spinning">sync</span>
      </button>
    </form>
  </div>
</div>
