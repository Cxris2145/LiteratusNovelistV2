<div class="auth-wrapper">
  <div class="glass-panel login-box">
    <h2>Bienvenido a Literatus</h2>
    <p class="subtitle">Desbloquea el mundo inmersivo de la lectura interactiva.</p>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label>Usuario o correo</label>
        <input type="text" class="glass-input" formControlName="username" placeholder="Tu usuario o tu correo" autocomplete="username">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div style="position: relative;">
          <input [type]="showPassword ? 'text' : 'password'" class="glass-input" formControlName="password" placeholder="••••••••">
          <button type="button" (click)="togglePassword()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px;">
            <svg lucideEyeOff *ngIf="showPassword" style="width: 20px; height: 20px;"></svg>
            <svg lucideEye *ngIf="!showPassword" style="width: 20px; height: 20px;"></svg>
          </button>
        </div>
      </div>
      
      <div class="forgot-password-container">
        <a routerLink="/forgot-password" class="forgot-password-link">¿Olvidaste tu contraseña? Recupérala aquí</a>
      </div>

      <div class="error-banner" *ngIf="errorMsg">
        {{ errorMsg }}
        <button type="button" class="inline-action" *ngIf="needsVerification && !infoMsg"
                (click)="resendVerification()" [disabled]="isResending">
          {{ isResending ? 'Enviando…' : 'Reenviar el enlace' }}
        </button>
      </div>

      <div class="success-banner" *ngIf="infoMsg">
        {{ infoMsg }}
      </div>

      <button type="submit" class="glass-btn primary-login-btn" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading && !isGuestLoading ? 'Conectando...' : 'Iniciar sesión' }}
      </button>

      <div class="guest-login-divider">
        <span>o</span>
      </div>

      <button type="button" class="test-login-btn" (click)="loginAsGuest()" [disabled]="isLoading">
        <span class="material-symbols-rounded test-login-icon" aria-hidden="true">explore</span>
        <span>{{ isGuestLoading ? 'Preparando tu cuenta de prueba…' : 'Probar sin cuenta' }}</span>
      </button>
      <p class="test-login-note">Cuenta temporal: se borra al cerrar la página o después de una hora.</p>

    </form>

    <div class="footer-link">
      <span>¿No tienes una cuenta? <a routerLink="/register">Regístrate gratis</a></span>
    </div>
  </div>
</div>
