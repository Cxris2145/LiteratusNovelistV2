# Construye la imagen del backend y la publica en GitHub Container Registry (gratis).
# La máquina virtual de Azure (Arm64) la descarga desde ahí; para publicarla se usa
# respaldos-software/LiteratusNovelist-main/Producto/backend/deploy-azure.ps1
name: Imagen del backend

on:
  push:
    branches: [main]
    paths:
      - 'respaldos-software/LiteratusNovelist-main/Producto/backend/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La máquina virtual gratis de Azure es Arm64: QEMU permite construir esa versión aquí.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El nombre de la imagen va en minúsculas: ghcr.io no acepta mayúsculas.
      - uses: docker/build-push-action@v6
        with:
          context: respaldos-software/LiteratusNovelist-main/Producto/backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cxris2145/literatus-backend:latest
            ghcr.io/cxris2145/literatus-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
